name: Build On Push

on:
  push:
    branches:
      - master

jobs:
  build-project:
    # 2. Choose the operating system runner
    runs-on: ubuntu-latest

    steps:
      # 3. Download your repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 4. Set up the language environment (Node.js example)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 5. Install your project dependencies
      - name: Install dependencies
        run: yarn install

      # 6. Run your project build script
      - name: Run build
        run: yarn run build

      # 7. Configure Git identity for deployment
      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      # 8. Deploy the project
      - name: Deploy
        run: yarn run deploy
